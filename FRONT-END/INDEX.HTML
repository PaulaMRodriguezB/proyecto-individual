<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeador de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="STYLE.CSS">
</head>
<body>

  <div class="contenedor-principal">
    
    <!-- ENCABEZADO SUPERIOR -->
    <header class="encabezado-titulo mb-3">
      <h1 class="titulo-principal m-0">¡Hola, es un gran día para lograrlo! ♡</h1>
      <p class="subtitulo-principal text-uppercase m-0">UN PASO A LA VEZ.</p>
    </header>

    <div class="row g-4">
      
      <!-- COLUMNA IZQUIERDA -->
      <div class="col-lg-7 d-flex flex-column gap-3">
        
        <!-- CONTENEDOR 1: ENTRADA RAPIDA Y BOTÓN SELLO AGREGAR -->
        <section class="tarjeta-vidrio contenedor-entrada p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div class="flex-grow-1 me-3">
              <label class="etiqueta-seccion text-uppercase d-block mb-1">TAREAS POR HACER</label>
              <input type="text" id="campoTareaRapida" class="form-control campo-texto-transparente" placeholder="Escribe una nueva tarea...">
            </div>

            <button class="boton-sello-hanko d-flex flex-column align-items-center" id="botonAbrirModal">
              <div class="circulo-sello">済</div>
              <span class="texto-sello">Agregar</span>
            </button>
          </div>
        </section>

        <!-- CONTENEDOR 2: TABLA DE TAREAS POR HACER -->
        <section class="tarjeta-vidrio contenedor-tabla-tareas p-4 flex-grow-1">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0 fw-bold d-flex align-items-center gap-2">
              <i class="bi bi-clipboard-check"></i> TAREAS POR HACER
            </h5>
          </div>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr class="texto-encabezado-tabla text-uppercase border-bottom">
                  <th scope="col" style="width: 8%;">OK</th>
                  <th scope="col" style="width: 37%;">TAREA</th>
                  <th scope="col" style="width: 20%;">FECHA</th>
                  <th scope="col" style="width: 20%;">ENERGÍA</th>
                  <th scope="col" style="width: 15%;" class="text-end">ELIMINAR</th>
                </tr>
              </thead>
              <tbody id="cuerpoTablaTareas">
                <!-- Se llena desde JavaScript -->
              </tbody>
            </table>
          </div>
        </section>

      </div>

      <!-- COLUMNA DERECHA: ESPACIOS VACÍOS -->
      <div class="col-lg-5 d-flex flex-column gap-3">
        
        <!-- FILA SUPERIOR: CALENDARIO Y TIMER POMODORO -->
        <div class="row g-3">
          <div class="col-6">
            <section id="contenedor-calendario" class="tarjeta-vidrio contenedor-espacio-vacio p-3 h-100">
              <!-- ESPACIO VACÍO: CALENDARIO -->
            </section>
          </div>
          <div class="col-6">
            <section id="contenedor-pomodoro" class="tarjeta-vidrio contenedor-espacio-vacio p-3 h-100">
              <!-- ESPACIO VACÍO: TIMER POMODORO -->
            </section>
          </div>
        </div>

        <!-- FILA MEDIA: TAREAS HECHAS -->
        <section id="contenedor-tareas-hechas" class="tarjeta-vidrio contenedor-espacio-vacio flex-grow-1 p-3">
          <!-- ESPACIO VACÍO: TAREAS HECHAS -->
        </section>

        <!-- FILA INFERIOR: REPRODUCTOR DE MÚSICA -->
        <section id="contenedor-musica" class="tarjeta-vidrio contenedor-espacio-vacio p-3" style="min-height: 180px;">
          <!-- ESPACIO VACÍO: MÚSICA -->
        </section>

      </div>

    </div>
  </div>

  <!-- VENTANA MODAL ROSADA EN PALETA PASTEL -->
  <div class="modal fade" id="modalAgregarTarea" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content tarjeta-modal p-4 border-0">
        
        <div class="modal-header border-0 pb-2 pt-0 px-0">
          <h5 class="modal-title fw-bold text-uppercase w-100 text-center text-dark" style="letter-spacing: 1px;">AGREGAR TAREA</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body p-0 mt-3">
          <form id="formularioModalTarea">
            
            <!-- Campo de Texto Tarea -->
            <div class="mb-4">
              <input type="text" id="modalInputTitulo" class="form-control entrada-modal p-3" placeholder="¿Qué tarea vas a hacer?" required>
            </div>

            <!-- Categoría en Tarjetas Cuadradas con Checkmark -->
            <div class="mb-4">
              <label class="form-label fw-bold text-uppercase text-muted" style="font-size: 0.75rem;">CATEGORÍA</label>
              <div class="row g-2" id="opcionesCategoria">
                <div class="col-4">
                  <div class="tarjeta-categoria activo d-flex flex-column align-items-center text-center" data-valor="Trabajo">
                    <div class="marca-verificacion"><i class="bi bi-check-lg"></i></div>
                    <i class="bi bi-briefcase-fill fs-3 text-warning mb-1"></i>
                    <span class="small fw-semibold">Trabajo</span>
                  </div>
                </div>
                <div class="col-4">
                  <div class="tarjeta-categoria d-flex flex-column align-items-center text-center" data-valor="Estudio">
                    <div class="marca-verificacion"><i class="bi bi-check-lg"></i></div>
                    <i class="bi bi-journal-bookmark-fill fs-3 text-primary mb-1"></i>
                    <span class="small fw-semibold">Estudio</span>
                  </div>
                </div>
                <div class="col-4">
                  <div class="tarjeta-categoria d-flex flex-column align-items-center text-center" data-valor="Personal">
                    <div class="marca-verificacion"><i class="bi bi-check-lg"></i></div>
                    <i class="bi bi-person-fill fs-3 text-success mb-1"></i>
                    <span class="small fw-semibold">Personal</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Campo Fecha -->
            <div class="mb-4">
              <label class="form-label fw-bold text-uppercase text-muted" style="font-size: 0.75rem;">FECHA</label>
              <input type="date" id="modalInputFecha" class="form-control entrada-modal p-3" required>
            </div>

            <!-- Nivel de Energía -->
            <div class="mb-4">
              <label class="form-label fw-bold text-uppercase text-muted" style="font-size: 0.75rem;">NIVEL DE ENERGÍA</label>
              <div class="d-flex gap-2" id="opcionesEnergia">
                <button type="button" class="btn boton-energia flex-fill activo" data-valor="Fácil">
                  <i class="bi bi-lightning-fill text-success me-1"></i>Fácil
                </button>
                <button type="button" class="btn boton-energia flex-fill" data-valor="Media">
                  <i class="bi bi-lightning-fill text-warning me-1"></i>Media
                </button>
                <button type="button" class="btn boton-energia flex-fill" data-valor="Alta">
                  <i class="bi bi-lightning-fill text-danger me-1"></i>Alta
                </button>
              </div>
            </div>

            <!-- Botón Confirmar Rosado -->
            <button type="submit" class="btn boton-rosado-modal w-100 py-3 fw-bold text-uppercase">AGREGAR TAREA</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="APP.JS"></script>
</body>
</html>
