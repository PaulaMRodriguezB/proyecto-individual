<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeador de Tareas - Sprint 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="STYLE.CSS">
</head>
<body>

  <div class="contenedor-principal">
    
    <!-- ENCABEZADO SUPERIOR -->
    <header class="encabezado-titulo mb-3">
      <h1 class="titulo-principal m-0">Hola, es un gran día para lograrlo ♡</h1>
      <p class="subtitulo-principal text-uppercase m-0">UN PASO A LA VEZ.</p>
    </header>

    <div class="row g-4">
      
      <!-- COLUMNA IZQUIERDA -->
      <div class="col-lg-7 d-flex flex-column gap-3">
        
        <!-- CONTENEDOR 1: ENTRADA RAPIDA -->
        <section class="tarjeta-vidrio contenedor-entrada p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div class="flex-grow-1 me-3">
              <label class="etiqueta-seccion text-uppercase d-block mb-1">TAREAS POR HACER</label>
              <input type="text" id="campoTareaRapida" class="form-control campo-texto-transparente" placeholder="Escribe una nueva tarea y presiona Enter...">
            </div>

            <button class="boton-sello-hanko d-flex flex-column align-items-center" id="botonAbrirModal">
              <div class="circulo-sello">済</div>
              <span class="texto-sello">Agregar</span>
            </button>
          </div>
        </section>

        <!-- CONTENEDOR 2: TABLA DE TAREAS -->
        <section class="tarjeta-vidrio contenedor-tabla-tareas p-4 flex-grow-1">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0 fw-bold d-flex align-items-center gap-2">
              <i class="bi bi-clipboard-check"></i> TAREAS (<span id="textoFechaActual">HOY</span>)
            </h5>
          </div>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr class="texto-encabezado-tabla text-uppercase border-bottom">
                  <th scope="col" style="width: 8%;">OK</th>
                  <th scope="col" style="width: 32%;">TAREA</th>
                  <th scope="col" style="width: 25%;">DESCRIPCIÓN</th>
                  <th scope="col" style="width: 20%;">FECHA</th>
                  <th scope="col" style="width: 15%;" class="text-end">ELIMINAR</th>
                </tr>
              </thead>
              <tbody id="cuerpoTablaTareas">
                <!-- Se llena dinámicamente desde JS -->
              </tbody>
            </table>
          </div>
        </section>

      </div>

      <!-- COLUMNA DERECHA -->
      <div class="col-lg-5 d-flex flex-column gap-3">
        
        <!-- FILA SUPERIOR: CALENDARIO Y TIMER POMODORO -->
        <div class="row g-3">
          <div class="col-6">
            <!-- CALENDARIO INTERACTIVO -->
            <section id="contenedor-calendario" class="tarjeta-vidrio p-3 h-100 d-flex flex-column align-items-center justify-content-center text-center">
              <label for="filtroFechaCalendario" class="etiqueta-seccion text-uppercase mb-2 d-flex align-items-center gap-1" style="font-size: 0.75rem;">
                <i class="bi bi-calendar3"></i> FILTRAR DÍA
              </label>
              <input type="date" id="filtroFechaCalendario" class="form-control entrada-modal mb-2 text-center py-1 px-2" style="font-size: 0.85rem;">
              <button type="button" id="btnVerHoy" class="btn btn-sm text-danger fw-bold p-0" style="font-size: 0.75rem;">
                <i class="bi bi-arrow-clockwise"></i> Ver Hoy
              </button>
            </section>
          </div>

          <div class="col-6">
            <!-- TIMER POMODORO -->
            <section id="contenedor-pomodoro" class="tarjeta-vidrio p-3 h-100 d-flex flex-column align-items-center justify-content-center text-center">
              <span class="etiqueta-seccion text-uppercase mb-1" style="font-size: 0.75rem;">
                <i class="bi bi-stopwatch"></i> POMODORO
              </span>
              <div id="pantallaPomodoro" class="fw-bold my-1" style="font-size: 1.8rem; color: var(--color-texto-principal); letter-spacing: 1px;">
                25:00
              </div>
              <div class="d-flex gap-2">
                <button id="btnPlayPausePomodoro" class="btn btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; background-color: var(--color-rosado-principal); border: none;">
                  <i class="bi bi-play-fill text-white" id="iconoPlayPause"></i>
                </button>
                <button id="btnResetPomodoro" class="btn btn-sm btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                  <i class="bi bi-arrow-counterclockwise"></i>
                </button>
              </div>
              <span id="estadoPomodoro" class="text-muted mt-1" style="font-size: 0.65rem; font-weight: 600;">TIEMPO DE ENFOQUE</span>
            </section>
          </div>
        </div>

        <!-- FILA MEDIA: TAREAS HECHAS Y CUMPLIMIENTO -->
        <section id="contenedor-tareas-hechas" class="tarjeta-vidrio flex-grow-1 p-3 d-flex flex-column justify-content-between">
          <div>
            <h6 class="etiqueta-seccion text-uppercase mb-3 fw-bold" style="letter-spacing: 0.5px; font-size: 0.85rem;">
              TAREAS HECHAS
            </h6>

            <!-- CUMPLIMIENTO DE TAREAS -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="text-uppercase fw-semibold" style="font-size: 0.68rem; color: #4a5568;">CUMPLIMIENTO DE TAREAS</span>
                <span id="textoPorcentajeCumplimiento" class="fw-bold" style="font-size: 0.75rem; color: #10b981;">0%</span>
              </div>
              <div class="bar-progreso-contenedor">
                <div id="barraProgresoVerde" class="bar-progreso-relleno" style="width: 0%;"></div>
              </div>
            </div>

            <!-- ENCABEZADO DEVOLVER -->
            <span class="text-uppercase fw-semibold d-block mb-2" style="font-size: 0.68rem; color: #4a5568;">DEVOLVER</span>

            <!-- LISTA DE TAREAS COMPLETADAS CON BOTÓN DEVOLVER -->
            <div id="listaTareasHechas" class="d-flex flex-column gap-2 overflow-auto" style="max-height: 180px;">
              <!-- Se llena desde JavaScript -->
            </div>
          </div>
        </section>

        <!-- FILA INFERIOR: REPRODUCTOR DE MÚSICA -->
        <section id="contenedor-musica" class="tarjeta-vidrio contenedor-espacio-vacio p-3" style="min-height: 140px;">
          <!-- ESPACIO RESERVADO PARA REPRODUCTOR -->
        </section>

      </div>

    </div>
  </div>

  <!-- VENTANA MODAL CON VALIDACIÓN -->
  <div class="modal fade" id="modalAgregarTarea" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content tarjeta-modal p-4 border-0">
        
        <div class="modal-header border-0 pb-2 pt-0 px-0">
          <h5 class="modal-title fw-bold text-uppercase w-100 text-center text-dark" style="letter-spacing: 1px;">AGREGAR TAREA</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body p-0 mt-3">
          <!-- ALERTA DE ERROR BOOTSTRAP (REQUERIDO PASO 3) -->
          <div id="alertaError" class="alert alert-danger d-none my-2 p-2 text-center" role="alert" style="font-size: 0.8rem;">
            Por favor, completa todos los campos requeridos.
          </div>

          <form id="formularioModalTarea">
            
            <!-- Campo Nombre -->
            <div class="mb-3">
              <label class="form-label fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Nombre de la Tarea</label>
              <input type="text" id="newTaskNameInput" class="form-control entrada-modal p-2" placeholder="Ej. Estudiar JavaScript">
            </div>

            <!-- Campo Descripción (REQUERIDO SPRINT 1) -->
            <div class="mb-3">
              <label class="form-label fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Descripción</label>
              <textarea id="newTaskDescriptionInput" class="form-control entrada-modal p-2" rows="2" placeholder="Detalles de la tarea..."></textarea>
            </div>

            <!-- Campo Fecha de entrega (REQUERIDO SPRINT 1) -->
            <div class="mb-3">
              <label class="form-label fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Fecha de Entrega</label>
              <input type="date" id="newTaskDueDateInput" class="form-control entrada-modal p-2">
            </div>

            <!-- Campo Estado (REQUERIDO SPRINT 1) -->
            <div class="mb-4">
              <label class="form-label fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Estado</label>
              <select id="newTaskStatusInput" class="form-select entrada-modal p-2">
                <option value="">Selecciona un estado...</option>
                <option value="Por Hacer">Por Hacer</option>
                <option value="En Progreso">En Progreso</option>
              </select>
            </div>

            <button type="submit" class="btn boton-rosado-modal w-100 py-3 fw-bold text-uppercase">AGREGAR TAREA</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="APP.JS"></script>
</body>
</html>
